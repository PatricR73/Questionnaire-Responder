name: release

# Build the demo image and publish it to GHCR when a version tag is pushed.
# This is what makes the README's "Try it in 30 seconds" front door work:
# `docker run -p 8501:8501 ghcr.io/patricr73/qresp-demo:latest` exists only
# because a tagged release built and pushed it. The image is tagged both
# `latest` and with the version tag itself, so a pinned pull always resolves
# to the exact released environment. No repository secrets are used — the
# GITHUB_TOKEN's packages:write permission is sufficient for GHCR.

on:
  push:
    tags:
      - "v*"

jobs:
  docker:
    name: Build and push qresp-demo image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image is large by design (it bakes in the pinned environment and the
      # local embedding model), so the gha cache keeps rebuilds on later tags
      # fast instead of re-downloading the whole stack every release.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/patricr73/qresp-demo:latest
            ghcr.io/patricr73/qresp-demo:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
