name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-locked:
    name: pytest (requirements.lock — reproducibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # C2: the README credits the pinned environment with the published numbers,
      # so CI must exercise THAT environment — the loose file is the early-warning
      # leg, this leg is the reproducibility claim.
      - name: Install locked environment + pinned dev tools
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      # The embedding model download is a few hundred MB. The cache key hashes the
      # lockfile (C2) so a dependency change invalidates it instead of silently
      # serving a stale cache; restore-keys still finds the old cache when only
      # unrelated files changed.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-${{ hashFiles('requirements.lock') }}
          restore-keys: |
            hf-models-${{ runner.os }}-

      - name: Run tests
        run: pytest tests/

      - name: Console entry point works
        run: qresp --help

  test-loose:
    name: pytest (requirements.txt — early warning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install loose deps + pinned dev tools
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Pinned dev tools from the extra (C1) — never a floating pip install ruff,
      # which lets a tool release break main with no commit to this repo.
      - name: Install dev tools (pinned)
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src/ tests/ fixtures/

      - name: ruff format --check
        run: ruff format --check src/ tests/ fixtures/

      - name: mypy
        run: mypy src/
