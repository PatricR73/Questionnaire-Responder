[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "questionnaire-responder"
version = "0.1.0"
description = "Turn a vendor security questionnaire spreadsheet into a first-pass draft, citing your own security docs for every answer and never inventing a control you don't have."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7.0",
    "click>=8.1.0",
    "streamlit>=1.38.0",
    # Runtime deps that used to resolve only transitively (C1): src/answer/tokenize.py
    # imports these directly.
    "httpx>=0.27.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
# Everything a contributor needs to develop, lint, and type-check (C1). Pinned so
# a tool release cannot break main with no commit to this repo — CI installs this
# extra rather than a floating pip install ruff.
dev = [
    "pytest==9.1.1",
    "ruff==0.16.3",
    "mypy==1.16.1",
]

[project.scripts]
qresp = "src.pipeline:cli"

[tool.setuptools.packages.find]
include = ["src*", "qresp*"]

# Replaces the deleted root conftest.py, whose only purpose was putting the repo
# root on sys.path so `python -m src.pipeline` and the src.* imports work from
# anywhere. pytest's pythonpath option does the same thing declaratively.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Mirrors ruff.toml (which this section supersedes — see the commit that removed
# it): line-length 120 with E501 ignored (long documentation-grade comments and
# description strings are deliberate), default rules otherwise on.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]

[tool.mypy]
# Floor raised to 3.12 (C2): numpy 2.x's stubs use 3.12-only syntax, so mypy
# cannot check against a 3.11 target with the current dependency set.
python_version = "3.12"
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# mypy 1.16 crashes with an INTERNAL ERROR on the anthropic SDK's own type
# annotations on this Python; we check our code, not the SDK's.
module = "anthropic.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
# Third-party packages without library stubs: we check our code, not theirs.
module = [
    "openpyxl.*",
    "tokenizers",
    "chromadb.*",
    "streamlit.*",
    "pdfplumber.*",
    "docx",
    "rank_bm25",
]
ignore_missing_imports = true
